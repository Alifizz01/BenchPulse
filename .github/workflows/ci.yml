name: ci
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -t . -v
      # the real session probe on a real Windows runner: must not crash, must answer
      - if: runner.os == 'Windows'
        run: python -c "from benchpulse.sessions import current_usage; print(current_usage())"
